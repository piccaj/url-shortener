spring.application.name=url-shortener

# H2 in-memory database: zero setup, resets on restart. Swap for MySQL/Postgres in prod.
spring.datasource.url=jdbc:h2:mem:shortener
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fail fast on bad requests instead of wrapping them in a 500
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

server.port=8080
