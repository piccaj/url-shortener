spring.application.name=url-shortener

# H2 in-memory database: zero setup, resets on restart. Swap for MySQL/Postgres in prod.
spring.datasource.url=jdbc:h2:mem:shortener
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Serve the web UI from src/main/resources/static
spring.web.resources.add-mappings=true

# Container hosts (Render etc.) pass the port via $PORT; default 8080 for local runs
server.port=${PORT:8080}
